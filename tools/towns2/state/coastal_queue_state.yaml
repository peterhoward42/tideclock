# Runtime progression for the coastal county batch. Replace or edit to restart.
#
# Canonical order lives only in tools/towns2/prompt-colateral/coastal_county_queue.md.
# Next county: walk regions in that file (England, Wales, Scotland, Ireland, NI); within
# the first region whose list is not fully covered below, take the first county not in done.
#
# queue_exhausted: set true by the agent when no county remains (orchestrator stops). To
# re-orchestrate later, reset this to false and align done / coastal/*.txt yourself so the
# run looks like a fresh start (see coastal_batch_automation_spec.md).

queue_exhausted: false

artefacts:
